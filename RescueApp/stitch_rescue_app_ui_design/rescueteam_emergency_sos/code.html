<script>
  (function () {
    const btn = document.getElementById('sos-trigger');
    const ring = document.getElementById('sos-ring');
    const statusLabel = document.getElementById('sos-status-label');
    if (!btn || !ring || !statusLabel) return;

    let holdTimeout = null;
    let animFrame = null;
    let startTime = 0;
    const holdDuration = 3000;
    const circumference = 326.7;

    function resetHold() {
      if (holdTimeout) clearTimeout(holdTimeout);
      if (animFrame) cancelAnimationFrame(animFrame);
      holdTimeout = null;
      animFrame = null;
      ring.style.strokeDashoffset = circumference;
      statusLabel.textContent = 'Tap and hold for 3 seconds to send emergency alert';
      statusLabel.classList.remove('text-white');
    }

    function step() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / holdDuration, 1);
      ring.style.strokeDashoffset = circumference * (1 - progress);
      const remaining = Math.ceil((holdDuration - elapsed) / 1000);
      if (progress < 1) {
        statusLabel.textContent = `Hold for ${remaining}s to trigger dispatch...`;
        animFrame = requestAnimationFrame(step);
      } else {
        ring.style.strokeDashoffset = '0';
        statusLabel.textContent = 'Alert broadcasted to rescue command!';
        statusLabel.classList.add('text-white');
      }
    }

    function startHold(e) {
      e.preventDefault();
      startTime = Date.now();
      step();
      holdTimeout = setTimeout(() => {
        if (navigator.vibrate) navigator.vibrate([200, 100, 300]);
      }, holdDuration);
    }

    btn.addEventListener('mousedown', startHold);
    btn.addEventListener('touchstart', startHold, { passive: false });
    window.addEventListener('mouseup', resetHold);
    window.addEventListener('touchend', resetHold);
    window.addEventListener('touchcancel', resetHold);
  })();
</script></main></body></html>
